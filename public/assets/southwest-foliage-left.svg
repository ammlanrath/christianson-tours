    <path d="M120 100 C 160 140, 220 180, 280 200" stroke="#4a5d4e" stroke-width="2" fill="none"/>
    <path d="M160 200 C 210 250, 260 300, 310 320" stroke="#4a5d4e" stroke-width="2" fill="none"/>

